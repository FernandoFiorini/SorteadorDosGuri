<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lol-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#095056" />
      <stop offset="70%" stop-color="#031D24" />
      <stop offset="100%" stop-color="#010A13" />
    </radialGradient>
    <linearGradient id="lol-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E6D2" />
      <stop offset="40%" stop-color="#C8AA6E" />
      <stop offset="100%" stop-color="#7A5C29" />
    </linearGradient>
  </defs>

  <!-- Fundo do Ícone -->
  <rect width="512" height="512" rx="100" fill="#091428" />

  <!-- Cuia de Chimarrão -->
  <g id="cuia">
    <path d="M 110 240 C 110 420, 200 465, 256 465 C 312 465, 402 420, 402 240 Z" fill="#120A06" />
    <path d="M 116 245 C 116 410, 204 455, 256 455 C 308 455, 396 410, 396 245 Z" fill="#734320" stroke="#000" stroke-width="6" />
    
    <!-- Erva Mate -->
    <ellipse cx="256" cy="240" rx="142" ry="48" fill="#1C300B" />
    <ellipse cx="256" cy="240" rx="132" ry="40" fill="#4B8B2A" />
    <ellipse cx="256" cy="240" rx="115" ry="32" fill="#58A22F" />

    <!-- Bomba -->
    <path d="M 370 70 L 295 240" stroke="#12181C" stroke-width="24" stroke-linecap="round" opacity="0.3" />
    <path d="M 365 75 L 290 235" stroke="#D1D5DB" stroke-width="18" stroke-linecap="round" />
    <path d="M 365 75 L 290 235" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Emblema Oficial do LoL -->
  <g id="lol-official-logo" transform="translate(171, 250) scale(0.33)">
    <circle cx="256" cy="256" r="250" fill="#010A13" />
    <circle cx="256" cy="256" r="230" fill="url(#lol-gold)" />
    <circle cx="256" cy="256" r="205" fill="#010A13" />
    <circle cx="256" cy="256" r="190" fill="url(#lol-bg)" stroke="#1C8382" stroke-width="4" />
    
    <!-- Letra L Oficial -->
    <path d="M 125 90 L 210 90 L 210 325 L 380 325 L 380 395 L 125 395 Z" fill="url(#lol-gold)" stroke="#F0E6D2" stroke-width="3" />
    <path d="M 125 90 L 165 130 L 165 355 L 340 355 L 380 395 Z" fill="#FFFFFF" opacity="0.25" />
  </g>
</svg>
